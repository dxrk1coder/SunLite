    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; padding: 0; }
        .font-minecraft { font-family: 'VT323', monospace; }
        
        /* Minecraft-style emerald and sun glows */
        .emerald-glow { box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
        .sun-glow { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6)); }
        .logo-container { filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.5)); }

        /* Shimmering animation like enchanted items */
        @keyframes shimmer {
          0% { transform: translateX(-150%) skewX(-45deg); }
          50% { transform: translateX(150%) skewX(-45deg); }
          100% { transform: translateX(150%) skewX(-45deg); }
        }
        .shimmer-effect {
          position: relative;
          overflow: hidden;
        }
        .shimmer-effect::after {
          content: "";
          position: absolute;
          top: 0; left: 0; width: 200%; height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
          animation: shimmer 3s infinite;
        }

        /* Floating effect */
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 4s infinite ease-in-out; }

        /* Pulse and spin for sunrays */
        @keyframes ray-pulse {
          0%, 100% { opacity: 0.4; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.1); }
        }
        .animate-ray { animation: ray-pulse 2s infinite ease-in-out; }

        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        
        @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-scale-in { animation: scale-in 0.3s ease-out forwards; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #10b981; }
    </style>
